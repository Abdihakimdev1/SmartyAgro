<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="1" x2="0.95" y2="0">
      <stop offset="0" stop-color="#0a6b5a"/>
      <stop offset="0.5" stop-color="#14a86a"/>
      <stop offset="1" stop-color="#63e590"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.78" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9fbe7"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0d8a63"/>
      <stop offset="1" stop-color="#3fd883"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#04382c" flood-opacity="0.38"/>
    </filter>
    <clipPath id="r"><rect width="512" height="512" rx="120"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#shine)"/>
    <path d="M-20 410C120 360 250 392 532 300V532H-20Z" fill="#06503f" fill-opacity="0.16"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="117" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <g filter="url(#sh)">
    <!-- S monogram: one continuous stroke -->
    <path d="M350 150H214C168 150 140 176 140 212C140 246 164 266 206 276L304 300C346 310 372 330 372 366C372 402 344 428 296 428H162"
          fill="none" stroke="url(#s)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- circuit nodes at both ends -->
    <circle cx="364" cy="150" r="33" fill="url(#s)"/>
    <circle cx="364" cy="150" r="12" fill="url(#hole)"/>
    <circle cx="148" cy="428" r="33" fill="url(#s)"/>
    <circle cx="148" cy="428" r="12" fill="url(#hole)"/>
  </g>
  </svg>
